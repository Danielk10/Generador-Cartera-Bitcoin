plugins {
    alias(libs.plugins.android.application)
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { instr ->
        keystoreProperties.load(instr)
    }
}

android {
    // Redirigir la carpeta build a /tmp
    project.layout.buildDirectory.set(file("/tmp/calculo"))
    namespace 'com.diamon.ganar'
    compileSdk {
       version = release(37)
    }

    defaultConfig {
        applicationId "com.diamon.ganar"
        minSdk 23
        targetSdk 37
        versionCode 31
        versionName "2.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            } else {
                def envStoreFile = System.getenv("SIGNING_STORE_FILE")
                storeFile = envStoreFile ? file(envStoreFile) : null
                storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildToolsVersion '37.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // ViewModel y LiveData
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    // Bouncy Castle para Criptografia avanzada (RIPEMD160, SECP256k1)
    implementation libs.bcprov.jdk15to18
}